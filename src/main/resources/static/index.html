<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Market Analyzer</title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-chart-financial"></script>
</head>
<body>

<h2>BTCUSDT – Close Price</h2>

<canvas id="chart" width="900" height="400"></canvas>

<script>
const ctx = document.getElementById('chart').getContext('2d');

const chart = new Chart(ctx, {
    type: 'candlestick',
    data: {
        datasets: [{
            label: 'BTCUSDT',
            data: []
        }]
    },
    options: {
        responsive: true,
        scales: {
            x: {
                type: 'time',
                time: {
                    unit: 'second',
                    stepSize: 60
                }
            }
        }
    }
});

async function loadCandles() {
    const res = await fetch('/api/candle/getAll?symbol=BTCUSDT');
    const data = await res.json();

    chart.data.datasets[0].data = data.map(c => ({
        x: new Date(c.endTime),
        o: c.openPrice,
        h: c.highPrice,
        l: c.lowPrice,
        c: c.closePrice
    }));

    chart.update();
}

async function loadAlerts() {
    const res = await fetch('/api/alerts?symbol=BTCUSDT');
    const alerts = await res.json();

    chart.data.datasets[1].data = alerts.map(a => ({
        x: new Date(a.triggeredAt),
        y: a.message
    }));

    chart.update();
}

async function loadAll() {
    await loadCandles();
    await loadAlerts();
}

chart.data.datasets.push({
    label: 'Alerts',
    type: 'scatter',
    data: [],
    pointRadius: 6,
    pointStyle: 'triangle',
    backgroundColor: 'red'
});

loadAll();
</script>

</body>
</html>
